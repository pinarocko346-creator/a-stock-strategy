name: A股抄底波段222每日选股

on:
  schedule:
    # 每天北京时间 16:00 (UTC 08:00)
    - cron: '0 8 * * *'
  workflow_dispatch:

jobs:
  screen:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install akshare>=1.15.0 pandas>=2.0.0 numpy>=1.24.0

      - name: Run 抄底波段222选股
        id: screener
        timeout-minutes: 90
        run: |
          mkdir -p results
          python stock_screener_bottom_band.py 2>&1 | tee results/screen_$(date +%Y%m%d).log
          # 移动生成的 CSV 到 results 目录
          mv qualified_stocks_bottom_band_*.csv results/ 2>/dev/null || true
          mv qualified_stocks_bottom_band_*.txt results/ 2>/dev/null || true

      - name: Prepare Discord message
        id: prepare
        run: |
          CSV_FILE=$(ls results/qualified_stocks_bottom_band_*.csv 2>/dev/null | head -1)
          TXT_FILE=$(ls results/qualified_stocks_bottom_band_*.txt 2>/dev/null | head -1)
          
          if [ -f "$CSV_FILE" ]; then
            COUNT=$(tail -n +2 "$CSV_FILE" | wc -l)
            echo "count=$COUNT" >> $GITHUB_OUTPUT
            echo "csv_file=$CSV_FILE" >> $GITHUB_OUTPUT
            echo "has_results=true" >> $GITHUB_OUTPUT
          else
            echo "count=0" >> $GITHUB_OUTPUT
            echo "has_results=false" >> $GITHUB_OUTPUT
          fi

      - name: Upload Results
        uses: actions/upload-artifact@v4
        with:
          name: a-stock-results-${{ github.run_id }}
          path: results/
          retention-days: 30

      - name: Commit Results
        if: ${{ success() }}
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          mkdir -p results
          git add results/
          git diff --staged --quiet || (git commit -m "📊 A股选股结果 $(date +%Y-%m-%d)" && git push) || echo "无更改需要提交"

      - name: Send to Discord
        if: ${{ success() }}
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          COUNT="${{ steps.prepare.outputs.count }}"
          
          if [ "$COUNT" -gt 0 ]; then
            MSG="📈 A股抄底波段222选股完成 - $(date +%Y-%m-%d)\\n入选股票: **$COUNT** 只\\n查看详情: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          else
            MSG="📈 A股抄底波段222选股完成 - $(date +%Y-%m-%d)\\n今日无符合筛选条件的股票\\n查看详情: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          fi
          
          if [ -n "$DISCORD_WEBHOOK" ]; then
            curl -H "Content-Type: application/json" \
                 -X POST \
                 -d "{\"content\": \"$MSG\"}" \
                 $DISCORD_WEBHOOK
          else
            echo "未配置 DISCORD_WEBHOOK_URL"
          fi
