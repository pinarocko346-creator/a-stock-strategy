name: 美股抄底波段222每日选股

on:
  schedule:
    # 每天北京时间 09:30 (UTC 01:30)
    - cron: '30 1 * * *'
  workflow_dispatch:

jobs:
  screen-us:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-us-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-us-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run 美股抄底波段222选股
        id: screener
        timeout-minutes: 60
        run: |
          mkdir -p results_us
          python us_stock_screener_bottom_band.py 2>&1 | tee results_us/screen_us_$(date +%Y%m%d).log
          mv qualified_stocks_us_bottom_band_*.csv results_us/ 2>/dev/null || true
          mv qualified_stocks_us_bottom_band_*.txt results_us/ 2>/dev/null || true

      - name: Prepare Discord message
        id: prepare
        run: |
          CSV_FILE=$(ls results_us/qualified_stocks_us_bottom_band_*.csv 2>/dev/null | head -1)
          if [ -f "$CSV_FILE" ]; then
            COUNT=$(tail -n +2 "$CSV_FILE" | wc -l | tr -d ' ')
            echo "count=$COUNT" >> $GITHUB_OUTPUT
            echo "csv_file=$CSV_FILE" >> $GITHUB_OUTPUT
            echo "has_results=true" >> $GITHUB_OUTPUT
            # 前 15 行摘要（表头+14 只）供 Discord 粘贴
            head -16 "$CSV_FILE" > results_us/discord_preview.csv
          else
            echo "count=0" >> $GITHUB_OUTPUT
            echo "has_results=false" >> $GITHUB_OUTPUT
          fi

      - name: Upload Results
        uses: actions/upload-artifact@v4
        with:
          name: us-stock-results-${{ github.run_id }}
          path: results_us/
          retention-days: 30

      - name: Commit Results
        if: ${{ success() }}
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          mkdir -p results_us
          git add results_us/
          git diff --staged --quiet || (git commit -m "📊 美股选股结果 $(date +%Y-%m-%d)" && git push) || echo "无更改需要提交"

      - name: Send to Discord
        if: ${{ success() }}
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          COUNT="${{ steps.prepare.outputs.count }}"
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          
          if [ "$COUNT" -gt 0 ]; then
            MSG="🇺🇸 **美股抄底波段222选股** - $(date +%Y-%m-%d) 09:30\\n入选: **$COUNT** 只\\n📎 详情与 CSV: $RUN_URL"
          else
            MSG="🇺🇸 **美股抄底波段222选股** - $(date +%Y-%m-%d) 09:30\\n今日无符合条件股票\\n📎 日志: $RUN_URL"
          fi
          
          if [ -n "$DISCORD_WEBHOOK" ]; then
            curl -sS -H "Content-Type: application/json" \
                 -X POST \
                 -d "{\"content\": \"$MSG\"}" \
                 "$DISCORD_WEBHOOK"
          else
            echo "未配置 DISCORD_WEBHOOK_URL"
          fi
